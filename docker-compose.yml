services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: coordia
      POSTGRES_USER: coordia
      POSTGRES_PASSWORD: coordia
    ports:
      - "5432:5432"
    volumes:
      - coordia-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coordia -d coordia"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  coordia-postgres:
